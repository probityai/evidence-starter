name: pin-refresh

# Moves the family lock in version-pins.toml and the pages it holds to the newest
# releases as a pull request, runs ci.yml on it and merges it when green. The hourly
# run is the path: a release reaches this repository within an hour, inside the
# one-day grace registry-verify allows.

on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "why it runs now"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A persisted checkout credential plus the token push makes GitHub refuse the push
          # with HTTP 400 ("Duplicate header"), which left the family lock stale.
          persist-credentials: false
      - uses: probityai/.github/actions/pin-refresh@254c480fa2f8fe086de36fcee1b8d17df731b6b9 # main
        with:
          ci: ci.yml
          token: ${{ github.token }}
