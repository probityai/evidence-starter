name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned packages
        run: python -m pip install ".[test]"
      - name: Record a write and check a claim about it
        run: evidence-starter "$RUNNER_TEMP/run"
      - name: Run the tests
        run: python -m pytest -q
      - name: The README stays one screen and every link in it resolves
        run: python scripts/readme-lint.py README.md
      - name: Every version a page names equals its manifest or the family lock
        uses: probityai/.github/actions/version-pins@ecb47052aa3ae8188c74f3cdc31eb8f4e9402811 # main
        with:
          command: check
      - name: A planted stale pin turns the version check red
        uses: probityai/.github/actions/version-pins@ecb47052aa3ae8188c74f3cdc31eb8f4e9402811 # main
        with:
          command: test

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false
      - name: Build the reference verifier pinned in tools/go.mod
        run: go build -C tools -o "$GITHUB_WORKSPACE/aee-verify" github.com/probityai/agent-evidence-vectors/cmd/aee-verify
      - name: Replay the conformance corpus against it
        uses: probityai/agent-evidence-vectors@a78eb265ece4163e5d4e08eb5865fac05d12cab0 # v0.29.3
        with:
          verifier: ./aee-verify -validity-only -json
