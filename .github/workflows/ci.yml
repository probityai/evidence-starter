name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request supersedes the older run; merge-queue
  # batches and pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned packages
        run: python -m pip install ".[test]"
      - name: Check a claim about the retained write
        run: evidence-starter "$RUNNER_TEMP/run"
      - name: Run the tests
        run: python -m pytest -q
      - name: The README stays one screen and every link in it resolves
        run: python scripts/readme-lint.py README.md
      - name: Every version a page names equals its manifest or the family lock
        uses: probityai/.github/actions/version-pins@254c480fa2f8fe086de36fcee1b8d17df731b6b9 # main
        with:
          command: check
      - name: A planted stale pin turns the version check red
        uses: probityai/.github/actions/version-pins@254c480fa2f8fe086de36fcee1b8d17df731b6b9 # main
        with:
          command: test

  # The hash-locked set: uv.lock must match pyproject.toml, and the example and the tests
  # pass on exactly the versions it records. `demo` above installs the way the README says,
  # resolving fresh, and install-smoke.yml does the same nightly.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install exactly the locked versions
        run: uv sync --locked --extra test --python 3.12
      - name: The example prints supported on the locked set
        run: |
          set -euo pipefail
          uv run --locked --no-sync evidence-starter "$RUNNER_TEMP/run" | tee "$RUNNER_TEMP/out.txt"
          grep -q '^decision: supported ' "$RUNNER_TEMP/out.txt"
      - name: The tests pass on the locked set
        run: uv run --locked --no-sync python -m pytest -q

  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache: false
      - name: Build the reference verifier pinned in tools/go.mod
        run: go build -C tools -o "$GITHUB_WORKSPACE/aee-verify" github.com/probityai/agent-evidence-vectors/cmd/aee-verify
      - name: Replay the conformance corpus against it
        uses: probityai/agent-evidence-vectors@13247ea551e470fb57413fdfab4f2738147613a1 # v0.36.3
        with:
          verifier: ./aee-verify -validity-only -json

  # The one status the main ruleset requires. It runs even when a job fails or
  # is skipped, and passes only when every job it needs passed or was skipped
  # by path selection.
  ci-ok:
    if: always()
    needs: [demo, lock, vectors]
    runs-on: ubuntu-latest
    steps:
      - name: Every selected job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required job ended $r"; exit 1 ;;
            esac
          done
