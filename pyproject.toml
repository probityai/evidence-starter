[project]
name = "evidence-starter"
version = "0.1.0"
description = "Record a signed agent action and check a claim about it offline."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "agent-evidence-observer==0.1.1",
    "probity-verify==0.2.2",
    "probityai==0.1.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pyyaml==6.0.3"]

[project.scripts]
evidence-starter = "evidence_starter.demo:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
